<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lukas Kahmann | Game Dev Portfolio – Unseen Labyrinth</title>
  <link rel="icon" type="image/png" href="../assets/logo.png" />
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/project-detail.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700,400|Poppins:400,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
  <header id="header"></header>

  <main class="project-main">
    <!-- Hero -->
    <section class="project-hero">
      <!-- <video class="project-image" src="../assets/Background_Unseen_Labirynth.PNG" autoplay loop muted playsinline></video> -->
      <img class="project-image" src="../assets/Background_Unseen_Labirynth.PNG" alt="Unseen Labyrinth Cover">
      <div class="project-title-box">
        <h1 data-i18n="project_title">Unseen Labyrinth</h1>
        <span class="project-role" data-i18n="project_role"></span>
      </div>
    </section>

    <div class="project-detail-layout">
      <!-- Einleitende Infos -->
      <section class="project-info-row">
        <div class="project-about card">
          <h2 data-i18n="about_project"></h2>
          <p data-i18n="about_intro_line1"></p>
          <p data-i18n="about_intro_line2"></p>
        </div>

        <div class="project-details card">
          <h2 data-i18n="project_info"></h2>
          <div class="project-info-row"><i class="fa-solid fa-note-sticky"></i> <span data-i18n="jam_line"></span></div>
          <div class="project-info-row"><i class="fa-solid fa-people-group"></i> <span data-i18n="team_line"></span></div>
          <div class="project-info-row"><i class="fa-solid fa-microchip"></i> <span data-i18n="engine_line"></span></div>
        </div>
      </section>

      <!-- Haupttext -->
      <div class="project-detail-body card">
        <h3 data-i18n="flow_head"></h3>
        <p data-i18n="flow_text"></p>

        <h3 data-i18n="grid_head"></h3>
        <p data-i18n="grid_text"></p>

        <h3 data-i18n="tiles_head"></h3>
        <p data-i18n="tiles_text"></p>
        <div class="project-body-media-single">
          <img src="../assets/placeholder-image-16x9.png" alt="Fog vs. aufgedeckte Tiles">
          <figcaption data-i18n="tiles_caption"></figcaption>
        </div>

        <h3 data-i18n="cards_head"></h3>
        <p data-i18n="cards_text1"></p>
        <p data-i18n="cards_text2"></p>
        <p data-i18n="cards_types"></p>

        <div class="project-body-media-single">
          <img src="../assets/placeholder-image-16x9.png" alt="Kartenübersicht">
          <figcaption data-i18n="cards_caption"></figcaption>
        </div>

        <p data-i18n="playcard_intro"></p>
        <div class="project-body-media-single">
          <video src="../assets/placeholder-video.mp4" autoplay loop muted playsinline></video>
          <figcaption data-i18n="playcard_video_caption"></figcaption>
        </div>

        <h3 data-i18n="uiux_head"></h3>
        <p data-i18n="uiux_text"></p>

        <div class="project-body-media-single">
          <img src="../assets/placeholder-image-16x9.png" alt="Ingame-HUD Gesamtansicht">
          <figcaption data-i18n="uiux_hud_caption"></figcaption>
        </div>

        <p data-i18n="phases_text"></p>
        <p data-i18n="cards_ui_flow_text"></p>

        <div class="project-body-media-single">
          <img src="../assets/placeholder-image-16x9.png" alt="Header Phasenanzeige, Zugzähler, End Turn">
          <figcaption data-i18n="phases_caption"></figcaption>
        </div>

        <div class="project-body-media-single">
          <img src="../assets/placeholder-image-16x9.png" alt="Kartenhand Zustände">
          <figcaption data-i18n="cards_hand_caption"></figcaption>
        </div>

        <div class="project-body-media-single">
          <video src="../assets/placeholder-video.mp4" autoplay loop muted playsinline></video>
          <figcaption data-i18n="cards_flow_video_caption"></figcaption>
        </div>

        <h3 data-i18n="cinematics_head"></h3>
        <p data-i18n="cinematics_text"></p>

        <div class="project-body-media-single">
          <video src="../assets/placeholder-video.mp4" autoplay loop muted playsinline></video>
          <figcaption data-i18n="cinematics_start_caption"></figcaption>
        </div>
        <div class="project-body-media-single">
          <video src="../assets/placeholder-video.mp4" autoplay loop muted playsinline></video>
          <figcaption data-i18n="cinematics_win_caption"></figcaption>
        </div>
        <div class="project-body-media-single">
          <video src="../assets/placeholder-video.mp4" autoplay loop muted playsinline></video>
          <figcaption data-i18n="cinematics_gameover_caption"></figcaption>
        </div>

        <h3 data-i18n="camera_head"></h3>
        <p data-i18n="camera_text"></p>

        <h3 data-i18n="audio_art_head"></h3>
        <p data-i18n="audio_art_text"></p>

         <!-- Meine Rolle -->
        <h3 data-i18n="myrole_head"></h3>
        <p data-i18n="myrole_text"></p>

        <!-- Reflexion -->
        <h3 data-i18n="reflection_head"></h3>
        <p data-i18n="reflection_text"></p>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>
  <script src="../js/includes.js"></script>
</body>
</html>
