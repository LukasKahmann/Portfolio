<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lukas Kahmann | Game Dev Portfolio – RPG-Prototyp</title>
  <link rel="icon" type="image/png" href="../assets/logo.png" />
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/project-detail.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700,400|Poppins:400,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
  <header id="header"></header>

  <main class="project-main">
    <!-- Hero-Bild -->
    <section class="project-hero">
      <img class="project-image" src="../assets/rpg-prototype/RPG_Covershot_3.png" alt="RPG-Prototyp Cover">
    </section>
    <div class="project-title-box-below">
        <h1 data-i18n="project_title"></h1>
        <span class="project-role" data-i18n="project_role"></span>
    </div>
    <div class="project-detail-layout">
      <!-- Überblick -->
      <section class="project-info-row">
        <div class="project-about card">
          <h2 data-i18n="description_head"></h2>
          <p data-i18n="description_text"></p>
        </div>
        <div class="project-details card">
          <h2 data-i18n="project_info"></h2>
            <div class="project-info-row"><i class="fa-solid fa-user-gear"></i> <span data-i18n="role_label"></span><span data-i18n="project_role"></span></div>
            <div class="project-info-row"><i class="fa-solid fa-cube"></i><span data-i18n="type_label"></span><span data-i18n="project_type"></span></div>
            <div class="project-info-row"><i class="fa-solid fa-microchip"></i> Engine: Unreal Engine 5</div>
            <div class="project-info-row"><i class="fa-solid fa-circle-check"></i><span data-i18n="status_label"></span><span data-i18n="project_status"></span></div>
            <!-- Hinweis: Link-Target bleibt unverändert gemäß deiner Bitte, nur Bullet-Thema zu ändern -->
            <div class="project-info-row"><i class="fa-brands fa-itch-io"></i><a href="https://lukaskahmann.itch.io/rpg-prototype" target="https://lukaskahmann.itch.io/rpg-prototype" rel="noopener" class="project-link">itch.io</a></div>
        </div>
      </section>

      <div class="project-detail-body card">
        <h3 data-i18n="overview_head"></h3>
        <p data-i18n="overview_text"></p>
      </div>

      <!-- Phase 1 -->
      <div class="collapsible-section">
        <button class="collapsible-toggle">
          <span data-i18n="phase1_head"></span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="project-detail-body card collapsible-content">
          <p data-i18n="phase1_intro"></p>

          <h4 data-i18n="phase1_stats_head"></h4>
          <p data-i18n="phase1_stats_text"></p>
          <div class="project-body-media-single-wide">
            <video src="../assets/rpg-prototype/RPG_StatComp.mp4" autoplay loop muted controls></video>
          </div>

          <h4 data-i18n="phase1_inventory_head"></h4>
          <p data-i18n="phase1_inventory_text"></p>


          <h4 data-i18n="phase1_ui_head"></h4>
          <p data-i18n="phase1_ui_text"></p>
          <div class="project-body-media-single-wide">
            <img src="../assets/rpg-prototype/RPG_Inventory.png" alt="">
          </div>

          <h4 data-i18n="phase1_inventorypanel_head"></h4>
          <p data-i18n="phase1_inventorypanel_text"></p>
          <div data-i18n="phase1_inventorypanel_list"></div>
          <div class="project-body-media-single-wide">
            <video src="../assets/rpg-prototype/RPG_Inventory Panel.mp4" autoplay loop muted controls></video>
          </div>

          <h4 data-i18n="phase1_equipment_head"></h4>
          <div data-i18n="phase1_equipment_text"></div>
          <div class="project-body-media-single-wide">
            <video src="../assets/rpg-prototype/RPG_EquipmentPanel.mp4" autoplay loop muted controls></video>
          </div>



          <h4 data-i18n="phase1_tooltip_head"></h4>
          <div data-i18n="phase1_tooltip_text"></div>
          <div class="project-body-media-single-wide">
            <video src="../assets/rpg-prototype/RPG_TooltipPanel.mp4" autoplay loop muted controls></video>
          </div>

          <h4 data-i18n="phase1_transfer_head"></h4>
          <div data-i18n="phase1_transfer_text"></div>
          <div class="project-body-media-single-wide">
            <video src="../assets/rpg-prototype/RPG_TransferRoot.mp4" autoplay loop muted controls></video>
          </div>


          <h4 data-i18n="phase1_styling_head"></h4>
          <p data-i18n="phase1_styling_text"></p>
          <div class="project-body-media-single">
            <img src="../assets/placeholder-image-16x9.png" alt="">
          </div>

          <h4 data-i18n="phase1_interaction_head"></h4>
          <p data-i18n="phase1_interaction_text"></p>
          <div class="project-body-media-single-wide">
            <video src="../assets/rpg-prototype/RPG_InteractionActor.mp4" autoplay loop muted controls></video>
          </div>
          

          <h4 data-i18n="phase1_worlditems_head"></h4>
          <p data-i18n="phase1_worlditems_text"></p>
          <div class="project-body-media-single-wide">
            <video src="../assets/rpg-prototype/RPG_WorldItem.mp4" autoplay loop muted controls></video>
          </div>

          <h4 data-i18n="phase1_worldinventories_head"></h4>
          <p data-i18n="phase1_worldinventories_text"></p>
          <div class="project-body-media-single-wide">
            <video src="../assets/rpg-prototype/RPG_WorldInventory.mp4" autoplay loop muted controls></video>
          </div>

          <h4 data-i18n="phase1_worldinteractables_head"></h4>
          <p data-i18n="phase1_worldinteractables_text"></p>
          <div class="project-body-media-single">
            <img src="../assets/placeholder-image-16x9.png" alt="">
          </div>

          <h4 data-i18n="phase1_reflection_head"></h4>
          <!-- WICHTIG: div, weil darin jetzt mehrere <ul> stecken -->
          <div data-i18n="phase1_reflection_text"></div>
        </div>
      </div>

      <!-- Phase 2 -->
      <div class="collapsible-section">
        <button class="collapsible-toggle">
          <span data-i18n="phase2_head"></span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="project-detail-body card collapsible-content">
          <p data-i18n="phase2_text"></p>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>
  <script src="../js/includes.js"></script>

  <script>
    document.querySelectorAll('.collapsible-toggle').forEach(button => {
      button.addEventListener('click', () => {
        const section = button.parentElement;
        section.classList.toggle('active');
      });
    });
  </script>
  <button id="backToTop" title="Zurück nach oben">
    <i class="fa-solid fa-arrow-up"></i>
  </button>
  <script>
    const backToTop = document.getElementById("backToTop");
    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        backToTop.style.display = "flex";
      } else {
        backToTop.style.display = "none";
      }
    });
    backToTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>

</body>
</html>
